version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fhldb
    ports:
      - '5434:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/fhldb
      - JWT_SECRET=supersecretkey
      - PORT=3000
    ports:
      - '3002:3000'
    command: sh -c "./scripts/wait-for-db.sh && node dist/index.js"
    depends_on:
      - db

volumes:
  db-data:
